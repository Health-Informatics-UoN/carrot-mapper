name: carrot-mapper-dev

x-airflow-common: &airflow-common
  volumes:
    - ./app/airflow/dags:/opt/airflow/dags
  depends_on:
    db:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Database connection here needs to be in URI format. With real values, which have special characters, they need to be encoded using the ref. in https://www.w3schools.com/tags/ref_urlencode.ASP.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
    AIRFLOW__WEBSERVER__SECRET_KEY: secret
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.keycloak.auth_manager.keycloak_auth_manager.KeycloakAuthManager
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_ID: CARROT-AIRFLOW
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_SECRET: ${AIRFLOW_OPENID_CLIENT_SECRET}
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__REALM: CARROT-MAPPER
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__SERVER_URL: ${KEYCLOAK_HOSTNAME}
    # This connection can be in separate variables (then don't need to do URL encoding), but it can reuse the same connection string with SQL_ALCHEMY_CONN (without extras)
    AIRFLOW_CONN_POSTGRES_DB_CONN: postgresql+psycopg2://postgres:postgres@db:5432/postgres
    AIRFLOW_CONN_MINIO_CONN: '{"conn_type": "aws", "extra": {"endpoint_url": "http://minio:9000", "aws_access_key_id": "minioadmin", "aws_secret_access_key": "minioadmin"}}'
    AIRFLOW_CONN_WASB_CONN: '{"conn_type": "wasb", "extra": {"connection_string": "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"}}'
    # The blob storage where Airflow get/put necessary files
    STORAGE_TYPE: ${STORAGE_TYPE:-minio}
    # Minio connection variables (don't need to do URL encoding here)
    AIRFLOW_VAR_MINIO_ENDPOINT: http://minio:9000
    AIRFLOW_VAR_MINIO_ACCESS_KEY: minioadmin
    AIRFLOW_VAR_MINIO_SECRET_KEY: minioadmin
    # WASB connection string (don't need to do URL encoding here)
    AIRFLOW_VAR_WASB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1

services:
  db:
    image: postgres:18
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    volumes:
      - db_data_pg18:/var/lib/postgresql
      - ./init-pg:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 30s
      start_period: 30s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      # Admin credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KeycloakBootstrapAdminPassword}

    command:
      ["${KeycloakStartupCommand}", "--import-realm", "--metrics-enabled=true"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8085:8080
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/0.0.0.0/9000; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q '\"status\": \"UP\"' <&3; exec 3<&- 3>&-",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 5s

  omop-lite:
    image: ghcr.io/health-informatics-uon/omop-lite:0.7.0
    volumes:
      - ./vocabs:/vocabs
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
      - SCHEMA_NAME=omop
      - DATA_DIR=vocabs
      - SYNTHETIC=true
      - SYNTHETIC_NUMBER=1000

  azurite:
    profiles: ["azure"]
    image: mcr.microsoft.com/azure-storage/azurite
    restart: always
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    command: azurite --blobHost azurite --queueHost azurite --tableHost azurite --location /data --debug /data/debug.log --loose --skipApiVersionCheck
    hostname: azurite
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==

  minio:
    profiles: ["main"]
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      MINIO_BROWSER: "on"
      MINIO_DOMAIN: "minio"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-api:
    <<: *airflow-common
    build:
      context: app/airflow
      dockerfile: Dockerfile
      args:
        AIRFLOW_COMPONENT: api
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-common-env
      AIRFLOW__API__PORT: 8080
      AIRFLOW__API__BASE_URL: ${AIRFLOW_BASE_URL}
    #  To resolve keycloak hostname in the container
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *airflow-common
    build:
      context: app/airflow
      dockerfile: Dockerfile
      args:
        AIRFLOW_COMPONENT: scheduler
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: True
      AIRFLOW_DEBUG_MODE: False
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api:8080/execution/"
      # Search recommendations feature flag - controls whether search recommendations task is included in auto_mapping DAG
      SEARCH_ENABLED: False
      AIRFLOW_DAGRUN_TIMEOUT: 60 # Timeout for each dagrun in minutes
      TEMP_TABLE_CLEANUP_DELAY: 60 # delay between cleanup attempts on failure
      AIRFLOW_VAR_JSON_VERSION: v2
      EXECUTE_VALUES_PAGE_SIZE: 1000000 # page size for bulk database inserts (execute_values)

  dag-processor:
    <<: *airflow-common
    build:
      context: app/airflow
      dockerfile: Dockerfile
      args:
        AIRFLOW_COMPONENT: dag-processor
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DAG_PROCESSOR__PRINT_STATS_INTERVAL: "0"

volumes:
  db_data_pg18:
  minio_data:
